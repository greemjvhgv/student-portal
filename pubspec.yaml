name: student_portal
description: "Offline-first mobile student portal (ITMDA3-34 Group 10)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  sqflite: ^2.3.0
  path: ^1.9.0
  http: ^1.2.0
  file_picker: ^13.1.0
  connectivity_plus: ^7.3.2

  # Token storage for authentication (lib/services/auth_service.dart).
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
